    :root{
      /* Palette */
      --bg1:#0f172a;   /* deep slate */
      --bg2:#0b1224;   /* navy */
      --panel:#0f1a35cc;
      --ink:#e6ebff;
      --muted:#9fb0cf;
      --line:#223052;

      --accent-a:#7c3aed; /* violet */
      --accent-b:#22d3ee; /* cyan */
      --accent-c:#60a5fa; /* blue */

      --white:#ffffff;
      --glass:rgba(255,255,255,.06);
      --shadow:0 24px 60px rgba(2,6,23,.4);

    html{scroll-behavior:smooth}

    img{max-width:100%; display:block}
