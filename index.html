<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kaushick Varma Gunturi — Business Analyst</title>
  <link rel="icon" href="favicon.png" />

  <style>
    /* ============ Base & Theme ============ */
    :root {
      --bg1: #f6fbff;
      --bg2: #eef6ff;
      --ink: #0b1020;
      --muted: #5b6b81;
      --chip: #ffffffaa;
      --glass: #ffffffb3;
      --white: #fff;
      --accent: #ffb703;
      --accent-2: #3b82f6;
      --accent-3: #a855f7;
      --shadow: 0 20px 40px rgba(27, 46, 94, 0.18);
      --radius-xl: 22px;
      --radius-lg: 18px;
      --radius-full: 999px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Inter, Helvetica, Arial, sans-serif;
      color: var(--ink);
      background: radial-gradient(900px 600px at 85% -10%, rgba(59, 130, 246, 0.18), transparent 60%),
        radial-gradient(800px 500px at 10% 110%, rgba(168, 85, 247, 0.16), transparent 60%),
        linear-gradient(180deg, var(--bg1), var(--bg2));
      background-attachment: fixed;
    }

    a {
      color: var(--accent-2);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    /* ============ Navbar ============ */
    .nav {
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(12px);
      background: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0.9) 0%,
        rgba(236, 244, 255, 0.9) 50%,
        rgba(225, 240, 255, 0.85) 100%
      );
      box-shadow: 0 2px 12px rgba(59, 130, 246, 0.1);
      border-bottom: 1px solid rgba(200, 220, 255, 0.6);
      transition: background 0.3s ease, box-shadow 0.3s ease;
    }

    .nav-inner {
      max-width: 1180px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      font-weight: 800;
      letter-spacing: 0.3px;
    }

    .nav ul {
      list-style: none;
      display: flex;
      gap: 22px;
      margin: 0;
      padding: 0;
    }

    .nav a {
      color: #334155;
      font-weight: 600;
    }

    .nav a:hover {
      color: #111827;
    }

    /* ============ Shell ============ */
    .container {
      max-width: 1180px;
      margin: 0 auto;
      padding: 48px 20px;
    }

    /* ============ HERO ============ */
    .hero {
      display: grid;
      grid-template-columns: 1.2fr 0.9fr;
      gap: 40px;
      align-items: center;
      padding: 28px 0 40px;
    }

    .kicker {
      color: #66789a;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    h1 {
      font-size: clamp(38px, 6vw, 64px);
      line-height: 1.03;
      margin: 10px 0 8px;
    }

    .lead {
      color: #5b6b81;
      font-size: clamp(16px, 2vw, 18px);
      max-width: 62ch;
    }

    .cta-row {
      display: flex;
      gap: 14px;
      margin-top: 22px;
    }

    .btn {
      display: inline-block;
      padding: 14px 20px;
      border-radius: 14px;
      font-weight: 800;
      box-shadow: var(--shadow);
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      filter: saturate(1.05);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent-2), #2563eb);
      color: #fff;
    }

    .btn-ghost {
      background: #fff;
      border: 1px solid #e6eef9;
      color: #0b1020;
    }

    /* Hero Art */
    .art {
      position: relative;
      display: grid;
      place-items: center;
      isolation: isolate;
    }

    .blob {
      position: absolute;
      width: 82%;
      height: 82%;
      border-radius: 45% 55% 60% 40% / 50% 45% 55% 50%;
      background: radial-gradient(120% 120% at 20% 10%, #ffd166 0 25%, #fca311 40%, #ffb703 60%, transparent 70%),
        radial-gradient(110% 110% at 85% 85%, #60a5fa 0 35%, #3b82f6 55%, transparent 70%);
      filter: blur(6px) saturate(1.05);
      transform: rotate(-6deg);
      z-index: -1;
      box-shadow: var(--shadow);
    }

    .headshot {
      width: min(360px, 72vw);
      height: min(360px, 72vw);
      border-radius: 50%;
      object-fit: cover;
      border: 6px solid #fff;
      box-shadow: 0 30px 70px rgba(59, 130, 246, 0.25);
      background: #fff;
    }

    .badge {
      position: absolute;
      right: 6%;
      top: 8%;
      background: #fff;
      padding: 10px 14px;
      border-radius: 14px;
      box-shadow: var(--shadow);
      font-weight: 800;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .shape {
      position: absolute;
      width: 16px;
      height: 16px;
      border-radius: 6px;
      opacity: 0.9;
    }

    .shape.star {
      clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    }

    .s1 {
      left: 10%;
      top: 22%;
      background: #60a5fa;
      animation: float 6s ease-in-out infinite;
    }

    .s2 {
      left: 44%;
      top: 6%;
      background: #f59e0b;
      animation: float 7s ease-in-out 0.3s infinite;
    }

    .s3 {
      left: 52%;
      top: 48%;
      background: #a78bfa;
      animation: float 5.5s ease-in-out 0.6s infinite;
    }

    @keyframes float {
      50% {
        transform: translateY(-10px) rotate(8deg);
      }
    }

    /* ============ Sections ============ */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 22px;
    }

    .card {
      background: var(--glass);
      backdrop-filter: blur(10px);
      border: 1px solid #e7eefb;
      border-radius: var(--radius-xl);
      padding: 22px;
      box-shadow: var(--shadow);
    }

    /* Brand Section Background */
    .brand-bg {
      position: relative;
      margin-top: 24px;
      padding: 80px 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .brand-bg::before {
      content: "";
      position: absolute;
      inset: 0;
      width: 85%;
      max-width: 900px;
      height: 360px;
      margin: auto;
      background: linear-gradient(180deg, #ffffffc9 0%, #f1f6ffb3 100%);
      border: 1px solid #e5ecf8;
      border-radius: 40px;
      box-shadow: 0 20px 50px rgba(100, 149, 237, 0.15);
      z-index: 0;
    }

      z-index: 2;
      width: 260px;
