    /* ================= Base, Theme & Resets ================= */
    :root{
      --bg1:#f3e8ff; /* lavender */
      --bg2:#eef4ff; /* soft blue */
      --ink:#0b1020;
      --muted:#5b6b81;
      --chip:#ffffffaa;
      --glass:#ffffffb3;
      --white:#fff;
      --accent:#ffb703;
      --accent-2:#3b82f6;
      --accent-3:#a855f7;
      --shadow:0 20px 40px rgba(27,46,94,.18);
      --radius-xl:22px;
      --radius-lg:18px;
      --radius-full:999px;
      --nav-h:64px;
    }
    /* Dark theme */
    :root[data-theme="dark"]{
      --bg1:#0f1220;
      --bg2:#0a0f1a;
      --ink:#e6e9f2;
      --muted:#a0acc2;
      --glass:rgba(18,22,33,0.6);
      --white:#121628;
      --accent:#ffb703;
      --accent-2:#60a5fa;
      --accent-3:#c084fc;
      --shadow:0 20px 40px rgba(0,0,0,.45);
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    html:focus-within{scroll-behavior:smooth}
    body{
      margin:0;
      font-family:ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Inter, Helvetica, Arial, sans-serif;
      color:var(--ink);
      background:linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 50%, #ffffff 100%);
      background-attachment:fixed;
    }
    :root[data-theme="dark"] body{
      background:linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 50%, #0a0f1a 100%);
    }
    a{color:var(--accent-2);text-decoration:none}
    a:hover{text-decoration:underline}
    img{max-width:100%;display:block}
    /* Focus styles */
    :where(a, button, [tabindex]):focus-visible{
      outline:3px solid var(--accent-2);
      outline-offset:3px;
      border-radius:10px;
    }

    /* ================= Layout Helpers ================= */
    .container{max-width:1180px; margin:0 auto; padding:48px 20px;}
    .section{scroll-margin-top:calc(var(--nav-h) + 20px);}
    .muted{color:var(--muted);}

    /* ================= Skip link ================= */
    .skip-link{
      position:absolute; left:-999px; top:auto; width:1px; height:1px; overflow:hidden;
    }
    .skip-link:focus{
      position:fixed; left:20px; top:12px; width:auto; height:auto; padding:10px 14px;
      background:#fff; color:#111; z-index:9999; border-radius:10px; box-shadow:var(--shadow);
    }
    :root[data-theme="dark"] .skip-link{background:#0d1222;color:#e6e9f2}

    /* ================= Navbar ================= */
    header.nav{
      position:sticky; top:0; z-index:50; height:var(--nav-h);
      backdrop-filter:blur(12px);
      background:linear-gradient(90deg, rgba(255,255,255,.9) 0%, rgba(236,244,255,.9) 50%, rgba(225,240,255,.85) 100%);
      box-shadow:0 2px 12px rgba(59,130,246,.1);
      border-bottom:1px solid rgba(200,220,255,.6);
      transition:background .3s ease, box-shadow .3s ease;
    }
    :root[data-theme="dark"] header.nav{
      background:linear-gradient(90deg, rgba(13,18,34,.8) 0%, rgba(12,16,29,.8) 100%);
      border-bottom:1px solid rgba(255,255,255,.08);
      box-shadow:0 2px 12px rgba(0,0,0,.5);
    }
    .nav-inner{
      max-width:1180px; margin:0 auto; padding:12px 20px;
      display:flex; align-items:center; justify-content:space-between;
    }
    .brand{font-weight:800; letter-spacing:.3px;}
    nav ul{list-style:none; display:flex; gap:22px; margin:0; padding:0;}
    nav a{color:#334155; font-weight:600; padding:10px 8px; border-radius:10px}
    nav a.active{background:rgba(59,130,246,.12); text-decoration:none}
    :root[data-theme="dark"] nav a{color:#c9d4ed}
    :root[data-theme="dark"] nav a.active{background:rgba(96,165,250,.15)}
