<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kaushick Varma Gunturi — Business Analyst</title>
  <link rel="icon" href="favicon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(180deg, #f8fafc 0%, #ffffff 100%);
      margin: 0;
      color: #1e293b;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 40px 20px;
    }

    h2 {
      font-weight: 800;
      font-size: 2.2rem;
      margin-bottom: 10px;
    }

    /* CONTACT SECTION */
    #contact {
      margin-top: 80px;
    }

    .contact-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 30px;
      margin-top: 20px;
    }

    .contact-card {
      background: linear-gradient(180deg, #ffffff, #fdf7f3);
      border: 1px solid #f1f5f9;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(255, 163, 58, 0.15);
      padding: 24px 28px;
      transition: all 0.3s ease;
    }

    .contact-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 28px rgba(249, 115, 22, 0.2);
    }

    .contact-card h3 {
      font-size: 1.25rem;
      margin-bottom: 8px;
      color: #0f172a;
    }

    .contact-card p {
      color: #475569;
      margin-bottom: 8px;
    }

    .cta-buttons {
      margin-top: 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }

    .btn {
      font-weight: 700;
      padding: 12px 20px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, #f97316, #f59e0b);
      color: white;
      box-shadow: 0 8px 16px rgba(249, 115, 22, 0.3);
    }

    .btn-primary:hover {
      box-shadow: 0 10px 18px rgba(249, 115, 22, 0.4);
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: white;
      color: #0f172a;
      border: 1px solid #e2e8f0;
    }

    .btn-secondary:hover {
      background: #f1f5f9;
    }

    /* SOCIAL CARDS */
    .social-card {
      background: linear-gradient(180deg, #ffffff, #f3f8ff);
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(59, 130, 246, 0.1);
      padding: 24px 28px;
      transition: all 0.3s ease;
    }

    .social-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 30px rgba(59, 130, 246, 0.2);
    }

    .socials {
      margin-top: 14px;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    .social-link {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #ffffff;
      padding: 10px 16px;
      border-radius: 999px;
      border: 2px solid #e2e8f0;
      font-weight: 700;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    }

    .social-link:hover {
      transform: translateY(-2px);
      border-color: #3b82f6;
      background: #eff6ff;
    }

    .social-link.linkedin::before {
      content: "in";
      font-size: 13px;
      background: #0a66c2;
      color: white;
      font-weight: 700;
      border-radius: 6px;
      padding: 3px 6px;
    }

    .social-link.github::before {
      content: "</>";
      font-size: 12px;
      background: #0f172a;
      color: white;
      font-weight: 700;
      border-radius: 6px;
      padding: 3px 6px;
    }

    /* FOOTER */
    footer {
      text-align: center;
      padding: 50px 20px;
      margin-top: 70px;
      background: linear-gradient(90deg, #f97316, #f59e0b, #f97316);
      color: white;
      font-weight: 600;
      position: relative;
      overflow: hidden;
    }

    footer::before {
      content: "";
      position: absolute;
      top: -80%;
      left: -80%;
      width: 260%;
      height: 260%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.15) 0%, transparent 70%);
      animation: rotateGlow 12s linear infinite;
    }

    @keyframes rotateGlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    footer p {
      position: relative;
      z-index: 1;
      font-size: 15px;
      margin: 0;
    }
  </style>
</head>

<body>
  <section id="contact" class="container">
    <h2>Let’s work together</h2>

    <div class="contact-grid">
      <div class="contact-card">
        <h3>Contact Information</h3>
        <p>I’m based in Pittsburgh, PA — available for full-time roles and freelance analytics projects.</p>
        <p><strong>Email:</strong> <a href="mailto:Kaushickgunturi@gmail.com">Kaushickgunturi@gmail.com</a></p>
        <p><strong>Phone:</strong> <a href="tel:+14128086629">+1 (412) 808-6629</a></p>

        <div class="cta-buttons">
          <button class="btn btn-primary">Start a project</button>
          <button class="btn btn-secondary">Download CV</button>
        </div>
      </div>

      <div class="social-card">
        <h3>Socials</h3>
        <p>Connect with me:</p>

        <div class="socials">
          <a class="social-link linkedin" href="https://www.linkedin.com" target="_blank">LinkedIn</a>
          <a class="social-link github" href="https://github.com/kaushickgunturi-debug" target="_blank">GitHub</a>
        </div>
      </div>
    </div>
  </section>

  <footer>
    <p>© 2025 Kaushick Varma Gunturi — All rights reserved.</p>
  </footer>
</body>
</html>
